<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Armazém Demo · Simulação</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f4; --fg: #1c1917; --card: #ffffff; --muted: #57534e;
      --accent: #1d4ed8; --warn-bg: #fef3c7; --warn-fg: #78350f;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f5f4; --card: #292524; --muted: #a8a29e; --accent: #60a5fa; --warn-bg: #451a03; --warn-fg: #fde68a; }
    }
    :root:not([data-theme="light"]) body { background: var(--bg); }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 8px 0; }
    .banner { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 12px; margin: 12px 0; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .stat b { display: block; font-size: 26px; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    label { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); }
    input { font-size: 16px; padding: 8px; width: 120px; border-radius: 8px; border: 1px solid #a8a29e; background: var(--card); color: var(--fg); }
    button { font-size: 16px; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    td { padding: 6px 0; border-bottom: 1px solid #a8a29e33; }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .error { color: #b91c1c; font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Armazém Demo · simulação de reposição</h1>
  <div class="banner">
    Demonstração com dados totalmente fictícios. Não é um cliente real, e os números são premissas da simulação, não medições.
  </div>

  <form id="form" class="card">
    <label>Semente<input id="seed" type="number" value="42" min="0" max="10000"></label>
    <label>Horas simuladas<input id="hours" type="number" value="2" min="0.5" max="2" step="0.5"></label>
    <label>Tarefas por hora<input id="rate" type="number" value="90" min="10" max="150"></label>
    <button type="submit">Simular</button>
  </form>
  <p id="error" class="error"></p>

  <section id="result" class="hidden"></section>

  <p class="muted">Mesmo seed, mesmo resultado. O despacho em operação real ainda não está publicado.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const LABELS = {
    idle: "Ocioso (inclui espera por oferta)",
    empty_travel: "Deslocamento vazio",
    working: "Trabalhando (separação e transporte carregado)",
  };
  const STATUS = { completed: "Concluídas", in_progress: "Em execução", assigned: "Atribuídas", offered: "Ofertadas", pending: "Pendentes" };

  function fmt(value, unit = "") { return value === null || value === undefined ? "—" : `${value}${unit}`; }
  function pct(value) { return `${(value * 100).toFixed(1)}%`; }

  function stat(label, value) {
    return `<div class="card stat"><span class="muted">${label}</span><b>${value}</b></div>`;
  }

  function rows(obj, labels, format = (v) => v) {
    return Object.entries(obj).map(([key, value]) =>
      `<tr><td>${labels[key] || key}</td><td>${format(value)}</td></tr>`).join("");
  }

  function render(report) {
    const rt = report.response_time_seconds;
    const share = report.operator_time_share;
    $("result").innerHTML = `
      <div class="grid">
        ${stat("Tarefas criadas", report.tasks_created)}
        ${stat("Concluídas", report.tasks_by_status.completed || 0)}
        ${stat("Mediana de resposta", fmt(rt.median, " s"))}
        ${stat("Operadores", report.operators)}
      </div>
      <div class="card">
        <h2>Tempo dos operadores</h2>
        <table>${rows(share, LABELS, pct)}</table>
      </div>
      <div class="card">
        <h2>Tarefas por status</h2>
        <table>${rows(report.tasks_by_status, STATUS)}</table>
      </div>
      <div class="card">
        <h2>Eventos</h2>
        <table>${rows(report.events, {}, (v) => v)}</table>
      </div>`;
    $("result").classList.remove("hidden");
  }

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("error").textContent = "";
    const params = new URLSearchParams({
      seed: $("seed").value, hours: $("hours").value, tasks_per_hour: $("rate").value,
    });
    try {
      const response = await fetch(`/api/simulate?${params}`);
      if (!response.ok) throw new Error(`Erro ${response.status}: verifique os valores informados.`);
      render(await response.json());
    } catch (error) {
      $("error").textContent = error.message;
    }
  });
</script>
</body>
</html>
